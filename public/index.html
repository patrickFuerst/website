<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patrick Fürst</title>
    <meta name="description" content="Personal website of Patrick Fürst." />
    <link rel="canonical" href="https://patrickfuerst.at/" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fafafa;
        --fg: #1a1a1a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111111;
          --fg: #ededed;
        }
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      h1 {
        font-size: clamp(2rem, 6vw, 4rem);
        font-weight: 600;
        letter-spacing: -0.02em;
      }
    </style>
  </head>
  <body>
    <h1>Hi, I'm Patrick</h1>
  </body>
</html>
