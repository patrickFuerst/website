<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patrick Fürst</title>
    <meta name="description" content="Personal website of Patrick Fürst." />
    <link rel="canonical" href="https://patrickfuerst.at/" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #fafaf7;
        --bg-0: rgba(250, 250, 247, 0);
        --ink: #1a1a18;
        --muted: #8a8a82;
        --faint: #b8b8b0;
        --stream-ink: #91918a;
        --m-fable: #6f63c4;
        --m-opus: #b07f35;
        --m-sonnet: #2f8d7d;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
        overflow: hidden;
      }
      main {
        height: 100dvh;
        display: flex;
        flex-direction: column;
      }
      .hero {
        padding-top: clamp(4rem, 16vh, 10rem);
        text-align: center;
        transition: padding 0.55s ease;
      }
      h1 {
        font-size: clamp(2rem, 6vw, 4rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        transition: font-size 0.55s ease;
      }
      main.expanded .hero {
        padding-top: 1.25rem;
      }
      main.expanded h1 {
        font-size: clamp(1.25rem, 2.5vw, 1.75rem);
      }

      /* the middle stays free for future content; the stream owns the lower third */
      .stream {
        margin-top: auto;
        height: 33dvh;
        display: flex;
        flex-direction: column;
        min-height: 0;
        transition: height 0.55s ease;
      }
      main.expanded .stream {
        height: calc(100dvh - 6.5rem);
      }
      .stream-label {
        appearance: none;
        background: none;
        border: 0;
        text-align: left;
        cursor: pointer;
        font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo,
          monospace;
        font-size: 0.7rem;
        letter-spacing: 0.06em;
        color: var(--muted);
        padding: 0 1.5rem 0.9rem;
        transition: color 0.15s ease;
      }
      .stream-label:hover {
        color: var(--ink);
      }
      .stream-label:focus-visible {
        outline: 2px solid var(--ink);
        outline-offset: 2px;
      }
      .stream-label .chev {
        display: inline-block;
        margin-right: 0.5rem;
        transition: transform 0.3s ease;
      }
      main.expanded .stream-label .chev {
        transform: rotate(90deg);
      }
      .stream-viewport {
        position: relative;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 88%, transparent);
        mask-image: linear-gradient(90deg, #000 0%, #000 88%, transparent);
      }
      .stream-viewport::before,
      .stream-viewport::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        z-index: 2;
        pointer-events: none;
      }
      .stream-viewport::before {
        top: 0;
        height: 52px;
        background: linear-gradient(var(--bg), var(--bg-0));
      }
      .stream-viewport::after {
        bottom: 0;
        height: 36px;
        background: linear-gradient(var(--bg-0), var(--bg));
      }
      .stream-scroll {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        padding: 0 1.5rem;
        width: max-content;
        max-width: none;
        animation: stream-up var(--dur, 90s) linear infinite;
      }
      @keyframes stream-up {
        from {
          transform: translateY(0);
        }
        to {
          transform: translateY(-50%);
        }
      }
      .stream-line {
        font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo,
          monospace;
        font-size: 0.74rem;
        white-space: nowrap;
        color: var(--stream-ink);
        transition: color 0.15s ease;
      }
      .stream-line .t {
        color: var(--faint);
        transition: color 0.15s ease;
      }
      .stream-line .model {
        font-weight: 500;
      }
      .stream-line:hover {
        color: var(--ink);
      }
      .stream-line:hover .t {
        color: var(--muted);
      }
      /* hold the stream still while reading */
      .stream-viewport:hover .stream-scroll {
        animation-play-state: paused;
      }
      @media (prefers-reduced-motion: reduce) {
        .stream-scroll {
          animation: none;
        }
        .hero,
        h1,
        .stream,
        .stream-label .chev {
          transition: none;
        }
      }
      /* narrow windows: wrap instead of clipping at the right edge */
      @media (max-width: 720px) {
        .stream-viewport {
          -webkit-mask-image: none;
          mask-image: none;
        }
        .stream-scroll {
          width: 100%;
        }
        .stream-line {
          white-space: normal;
        }
        .stream-line .sep {
          display: none;
        }
        .stream-line .text {
          display: block;
          margin-top: 0.15rem;
          line-height: 1.45;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="hero">
        <h1>Hi, I'm Patrick</h1>
      </header>
      <section class="stream" aria-label="Thoughts my AI agents had along the way">
        <button class="stream-label" type="button" aria-expanded="false"><span class="chev" aria-hidden="true">❯</span>thoughts my agents had along the way</button>
        <div class="stream-viewport">
          <div class="stream-scroll" id="stream"></div>
        </div>
      </section>
    </main>
    <script>
      let QUOTES = [
        { ts: "2026-08-20T09:48:38+02:00", model: "claude-fable-5", quote: "I'm keeping the module-level comment brief but justified, since it explains a genuinely non-obvious constraint about which error types leak submitted values." },
        { ts: "2026-08-20T09:49:29+02:00", model: "claude-fable-5", quote: "It's best-effort and never raises, so mirroring the existing test setup is safe." },
        { ts: "2026-08-20T11:01:46+02:00", model: "claude-fable-5", quote: "Continuing to ping hourly overnight would be wasteful, so I'm ending the loop and letting the user restart it if needed." },
        { ts: "2026-08-20T12:05:05+02:00", model: "claude-sonnet-5", quote: "There's no output, which suggests an empty list or an error — I should check the raw output to see what's happening." },
        { ts: "2026-08-20T12:09:29+02:00", model: "claude-opus-5", quote: "It's not actually a bug since the inner session is intentional, but it's a naming collision worth flagging since the outer parameter is new." },
        { ts: "2026-08-20T12:21:52+02:00", model: "claude-fable-5", quote: "I shouldn't fabricate results while waiting, so there's not much else productive to do right now." },
      ];

      const MODEL_COLOR = {
        "claude-fable-5": "var(--m-fable)",
        "claude-opus-5": "var(--m-opus)",
        "claude-sonnet-5": "var(--m-sonnet)",
      };
      const pad = (n) => String(n).padStart(2, "0");
      const esc = (s) =>
        s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

      function render() {
        const items = QUOTES.filter((q) => q && q.ts && q.model && q.quote)
          .slice()
          .sort((a, b) => a.ts.localeCompare(b.ts));
        if (!items.length) return;
        const lines = [];
        const repeats = Math.max(2, Math.ceil(30 / items.length));
        for (let rep = 0; rep < repeats; rep++) {
          for (const it of items) {
            const d = new Date(it.ts);
            const t = `${d.toISOString().slice(0, 10)} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
            const c = MODEL_COLOR[it.model] || "var(--muted)";
            const name = esc(it.model.replace(/^claude-/, "")).padEnd(9, " ");
            lines.push(
              `<div class="stream-line"><span class="t">${t}</span>  <span class="model" style="color:${c}">${name}</span><span class="sep"> ❯ </span><span class="text">${esc(it.quote)}</span></div>`
            );
          }
        }
        const el = document.getElementById("stream");
        el.style.setProperty("--dur", Math.round(lines.length * 2.6) + "s");
        el.innerHTML = lines.join("") + lines.join(""); /* duplicated for a seamless loop */
      }

      render();

      const mainEl = document.querySelector("main");
      const label = document.querySelector(".stream-label");
      function setExpanded(on) {
        mainEl.classList.toggle("expanded", on);
        label.setAttribute("aria-expanded", String(on));
      }
      label.addEventListener("click", () =>
        setExpanded(!mainEl.classList.contains("expanded"))
      );
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") setExpanded(false);
      });

      /* drop an updated highlights.jsonl next to this file and it takes over */
      fetch("highlights.jsonl")
        .then((r) => (r.ok ? r.text() : Promise.reject()))
        .then((text) => {
          const parsed = text
            .split("\n")
            .filter((l) => l.trim())
            .map((l) => {
              try {
                return JSON.parse(l);
              } catch {
                return null;
              }
            })
            .filter(Boolean);
          if (parsed.length) {
            QUOTES = parsed;
            render();
          }
        })
        .catch(() => {});
    </script>
  </body>
</html>
