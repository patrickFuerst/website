name: Deploy website

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PRs get their own disposable group (superseded builds are cancelled); the
  # production line stays serialized and is never cancelled mid-deploy.
  group: website-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # ghcr repository paths must be lowercase; github.repository would carry the
  # account's capital F.
  IMAGE: ghcr.io/patrickfuerst/website

jobs:
  build:
    name: Build website image (PR check)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Contributor-controlled build context runs here, so grant no registry
    # write: this job only proves the image builds, it never publishes.
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false

  publish:
    name: Build and publish website image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:main

  # This repository owns the image; the infra repository owns the Quadlet,
  # image selection, host deployment, and verification. Promotion dispatches
  # infra's promote-application.yml release contract with a GitHub App token
  # scoped to Actions read/write on the infra repository alone — this CI holds
  # no host, TLS, or variable-write credential.
  promote:
    name: Promote through Infra
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      INFRA_REPOSITORY: patrickFuerst/infra
    steps:
      - name: Require the deployment App credentials
        env:
          CLIENT_ID: ${{ vars.PF_DEPLOY_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.PF_DEPLOY_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$CLIENT_ID" ]]; then
            echo "The PF_DEPLOY_APP_CLIENT_ID repository variable is not configured." >&2
            exit 1
          fi
          if [[ -z "$PRIVATE_KEY" ]]; then
            echo "The PF_DEPLOY_APP_PRIVATE_KEY repository secret is not configured." >&2
            exit 1
          fi

      - name: Require a digest-pinned image
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Refusing to promote: image digest missing or malformed: '${IMAGE_DIGEST}'" >&2
            exit 1
          fi

      - name: Create a scoped Infra token
        id: infra-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.PF_DEPLOY_APP_CLIENT_ID }}
          private-key: ${{ secrets.PF_DEPLOY_APP_PRIVATE_KEY }}
          owner: patrickFuerst
          repositories: infra

      - name: Dispatch the Infra promotion
        env:
          GH_TOKEN: ${{ steps.infra-token.outputs.token }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          gh workflow run promote-application.yml --repo "$INFRA_REPOSITORY" --ref main \
            --field application=website \
            --field source_sha="$GITHUB_SHA" \
            --field image="${IMAGE}@${IMAGE_DIGEST}"

      - name: Wait for the Infra promotion
        env:
          GH_TOKEN: ${{ steps.infra-token.outputs.token }}
        run: |
          promotion_name="Promote website $GITHUB_SHA"
          run_id=""
          for _ in {1..30}; do
            run_id=$(
              gh run list --repo "$INFRA_REPOSITORY" \
                --workflow promote-application.yml \
                --event workflow_dispatch --limit 20 \
                --json databaseId,displayTitle \
                | jq -r --arg name "$promotion_name" \
                    '.[] | select(.displayTitle == $name) | .databaseId' \
                | head -n 1
            )
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            echo "Could not find the dispatched Infra promotion." >&2
            exit 1
          fi
          gh run watch "$run_id" --repo "$INFRA_REPOSITORY" --exit-status --interval 10
